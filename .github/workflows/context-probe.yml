name: Context Probe APK
on:
  push:
    branches: [experiment/chat-context-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile independent debug APK
        run: bash gradlew --no-daemon :experiments:chat-context-probe:assembleDebug
      - name: Upload probe APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-context-probe-debug
          path: experiments/chat-context-probe/build/outputs/apk/debug/*.apk
          if-no-files-found: error
