name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prepare verified offline model
        run: bash scripts/prepare-model.sh
      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDRY }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing JARVIS_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$SIGNING_PASSWORD" || { echo "::error::Missing ANDRY secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-signing.jks"
          keytool -list -keystore "$RUNNER_TEMP/jarvis-signing.jks" -storepass "$SIGNING_PASSWORD" -alias jarvis >/dev/null
          echo "JARVIS_KEYSTORE_PATH=$RUNNER_TEMP/jarvis-signing.jks" >> "$GITHUB_ENV"
      - name: Build, test and lint
        env:
          JARVIS_SIGNING_PASSWORD: ${{ secrets.ANDRY }}
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK signature and 16 KB ZIP alignment
        id: apk
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/package-apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact_name }}
          path: |
            ${{ steps.apk.outputs.apk_path }}
            ${{ steps.apk.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
